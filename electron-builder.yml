appId: 'kr.heyodd.minecraft.launcher'
productName: '영무예다음 Minecraft Launcher'
artifactName: 'HeyOdd-Launcher-Setup-${version}.${ext}'

copyright: 'Copyright © 2018-2026 Daniel Scalzi; Copyright © 2024 peunsu; HeyOdd Launcher contributors'

asar: true
compression: 'maximum'
afterPack: './tools/after-pack.cjs'

files:
  - '!{dist,.gitignore,.vscode,docs,dev-app-update.yml,.nvmrc,eslint.config.mjs}'

extraResources:
  - 'libraries'

# Windows Configuration
win: 
  icon: 'build/icon.ico'
  # This community build is unsigned. Disabling executable signing/editing also
  # keeps local builds usable on Windows machines without Developer Mode.
  signAndEditExecutable: false
  target: 
    - target: 'nsis'
      arch: 'x64'

# Windows Installer Configuration
nsis:
  installerIcon: 'build/icon.ico'
  uninstallerIcon: 'build/icon.ico'
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true

# macOS Configuration
mac:
  target:
    - target: 'dmg'
      arch:
        - 'x64'
        - 'arm64'
  artifactName: 'HeyOdd-Launcher-Setup-${version}-${arch}.${ext}'
  category: 'public.app-category.games'

# Linux Configuration
linux: 
  target: 'AppImage'
  maintainer: 'Daniel Scalzi, peunsu'
  vendor: 'Daniel Scalzi, peunsu'
  synopsis: 'Modded Minecraft Launcher'
  description: 'Custom launcher which allows users to join modded servers. All mods, configurations, and updates are handled automatically.'
  category: 'Game'


directories:
  buildResources: 'build'
  output: 'dist'
